<div class="chapter">
<div class="heading">
<h2>全书结束语</h2>
</div>
<div class="section">
<p>抗美援朝战争从1950年10月开始，至1953年7月结束，历时2年9个月。此后，中国人民志愿军又进行了维护朝鲜停战协定的斗争和帮助朝鲜人民恢复家园的工作，直至1958年10月全部撤出朝鲜回国。中国人民取得了抗美援朝战争的伟大胜利，谱写了新中国历史上的光辉篇章。这场战争具有许多新情况和新特点，中国人民取得这场战争的胜利具有十分重大的深远意义，并且积累了许多极为宝贵的经验。深入研究这场战争，总结其基本经验，是十分必要的，它有助于为探索以劣势装备战胜优势装备之敌，寻求现代技术特别是高技术条件下战争的指导规律提供重要的历史借鉴。</p>
