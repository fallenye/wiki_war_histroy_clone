<h2>第二十二章 反登陆作战准备</h2>
</div>
<div class="section">
<p>按照中共中央、中央军委的决策和部署，从1952年12月下旬起到1953年4月，志愿军以打好“过关仗”的姿态进行了规模空前的反登陆作战准备。</p>
