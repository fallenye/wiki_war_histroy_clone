<div class="chapter">
<div class="heading">
<h2>第二十章 在和平解决朝鲜问题上的斗争</h2>
</div>
<div class="section">
<p>在朝鲜停战谈判因美国在战俘问题上违反日内瓦公约有关规定，顽固坚持所谓“自愿遣返”原则，企图强迫扣留朝中被俘人员，并以流氓无赖的态度，故意拖延谈判和单方面无限期中断谈判会议的时候，亚太和平会议召开和联合国第七届大会开幕。爱好和平的国家和人民，在和平解决朝鲜问题上，在争取亚太及世界和平问题上进行了努力和斗争。与此同时，“联合国军”方面继续残酷迫害战俘，遭到中朝两国政府和人民以及国际舆论的强烈谴责。</p>
